name: Build Living Market 2.0

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack mod archive
        run: |
          if [ -f "livingmarket-forge-1.20.1-v2.0.0.zip" ]; then
            ZIP_FILE="livingmarket-forge-1.20.1-v2.0.0.zip"
          else
            ZIP_FILE=$(ls -t *.zip | head -n 1)
          fi
          echo "Using archive: $ZIP_FILE"
          rm -rf /tmp/mod_build
          mkdir -p /tmp/mod_build
          unzip -o "$ZIP_FILE" -d /tmp/mod_build
          BUILD_FILE=$(find /tmp/mod_build -name 'build.gradle' | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside $ZIP_FILE! Archive contents:"
            ls -la /tmp/mod_build
            exit 1
          fi
          BUILD_DIR=$(dirname "$BUILD_FILE")
          echo "BUILD_DIR=$BUILD_DIR" » $GITHUB_ENV
          echo "Project folder: $BUILD_DIR"
          ls -la "$BUILD_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Mod JAR
        run: |
          cd "$BUILD_DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out_jars"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out_jars/"
          ls -lh "$GITHUB_WORKSPACE/out_jars/"

      - name: Upload Ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: LivingMarket-2.0.0-Forge-1.20.1
          path: out_jars/*.jar
