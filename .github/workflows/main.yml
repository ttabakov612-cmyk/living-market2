name: Build Living Market 2.0

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack mod archive
        run: |
          ZIP_FILE=$(ls -t *.zip | head -n 1)
          echo "Unpacking: $ZIP_FILE"
          mkdir -p mod_build
          unzip -o "$ZIP_FILE" -d mod_build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Mod JAR
        working-directory: mod_build
        run: gradle build --no-daemon

      - name: Upload Ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: LivingMarket-2.0.0-Forge-1.20.1
          path: mod_build/build/libs/*.jar
